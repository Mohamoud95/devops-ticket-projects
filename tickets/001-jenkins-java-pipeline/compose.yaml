services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: ticket-1-jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./deployments:/var/jenkins_home/deployments

volumes:
  jenkins_home:
